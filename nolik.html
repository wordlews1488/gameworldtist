    <main class="wrapper-main">
<div class="nolik-comnata">
        <div class="comnata">
            <h2>Комната:</h2>

            <input id="roomInput" placeholder="Введите код">

            <button onclick="joinRoom()">Подключиться</button>
            <button onclick="createRoom()">Создать комнату</button>

<div class="board" id="board"></div>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</div>
        <div class="nolik">
<script>
    const socket = io("https://gameworldtist-6.onrender.com");

    let board = Array(9).fill("");
    let player = "X";
    let currentPlayer = "X";
    let room = "";

    const boardEl = document.getElementById("board");

    function render() {
        boardEl.innerHTML = "";
        board.forEach((cell, i) => {
            const div = document.createElement("div");
            div.className = "cell";
            div.innerText = cell;
            div.onclick = () => makeMove(i);
            boardEl.appendChild(div);
        });
    }

    function joinRoom() {
        room = document.getElementById("roomInput").value;
        socket.emit("joinRoom", room);
    }

    function makeMove(index) {
        if (board[index] !== "" || player !== currentPlayer) return;

        board[index] = player;
        socket.emit("move", { room, index, player });

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        render();
    }

    socket.on("move", ({ index, player: p }) => {
        board[index] = p;
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        render();
    });
    function createRoom() {
        room = Math.floor(1000 + Math.random() * 9000).toString(); // 4 цифры
        document.getElementById("roomInput").value = room;

        socket.emit("joinRoom", room);

        alert("Комната создана: " + room);
    }

    render();
</script>
            </div>
        </div>
    </main>
<script src="js/nolik.js"></script>
