<div class="nolik-comnata">
        <div class="comnata">
            <h2>Комната:</h2>

            <input id="roomInput" placeholder="Введите код">

            <button onclick="joinRoom()">Подключиться</button>
            <button onclick="createRoom()">Создать комнату</button>

<div class="board" id="board"></div>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</div>
        <div class="nolik">
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>
    const socket = io(); 

    let board = Array(9).fill("");
    let mySymbol = null; 
    let currentTurn = "X";
    let roomId = "";
    let gameActive = false;

    const boardEl = document.getElementById("board");
    const statusDiv = document.createElement("div");
    boardEl.parentNode.insertBefore(statusDiv, boardEl);

    function render() {
        boardEl.innerHTML = "";
        board.forEach((cell, i) => {
            const div = document.createElement("div");
            div.className = "cell";
            div.innerText = cell;
            div.onclick = () => makeMove(i);
            boardEl.appendChild(div);
        });
    }

    function joinRoom() {
        roomId = document.getElementById("roomInput").value.trim();
        if (!roomId) return alert("Введите код комнаты");
        socket.emit("joinRoom", roomId);
        statusDiv.innerText = "Подключение...";
    }

    function createRoom() {
        roomId = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById("roomInput").value = roomId;
        socket.emit("joinRoom", roomId);
        statusDiv.innerText = "Создание комнаты...";
    }

    function makeMove(index) {
        if (!gameActive) return;
        if (board[index] !== "") return;
        if (mySymbol !== currentTurn) return;
        socket.emit("makeMove", { roomId, index, symbol: mySymbol });
    }

    socket.on("assigned", ({ symbol, roomId: id }) => {
        roomId = id;
        mySymbol = symbol;
        statusDiv.innerText = `Вы в комнате ${roomId}. Ваш символ: ${mySymbol}. Ожидаем второго игрока...`;
    });

    socket.on("roomFull", ({ message }) => {
        alert(message);
    });

    socket.on("start", ({ board: serverBoard, turn }) => {
        board = [...serverBoard];
        currentTurn = turn;
        gameActive = true;
        render();
        statusDiv.innerText = `Игра началась! Ход: ${currentTurn}`;
    });

    socket.on("moveMade", ({ index, symbol, turn }) => {
        board[index] = symbol;
        currentTurn = turn;
        render();
        statusDiv.innerText = `Ход: ${currentTurn}`;
    });

    socket.on("gameOver", ({ winner }) => {
        gameActive = false;
        if (winner === "draw") statusDiv.innerText = "Ничья!";
        else statusDiv.innerText = `Победил ${winner}!`;
        board.fill("");
        render();
    });

    socket.on("opponentLeft", () => {
        gameActive = false;
        statusDiv.innerText = "Соперник отключился. Создайте новую комнату.";
        board.fill("");
        render();
    });

    render();
</script>
